[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klmelec"
dynamic = ["version"]
description = "Préparation de listes de matériel électrique"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.gui-scripts]
klmelec = "klmelec.app:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
klmelec = ["catalog.json", "assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
